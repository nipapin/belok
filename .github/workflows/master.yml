name: Build and deploy production

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: belok-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: aqsi_test
          POSTGRES_PASSWORD: aqsi_test
          POSTGRES_DB: aqsi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aqsi_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build
      SESSION_SECRET: ci-build-placeholder-never-used-at-runtime
      NEXT_PUBLIC_APP_URL: https://belok.pro
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ vars.PROD_VAPID_PUBLIC_KEY }}
      MAPBOX_API_KEY: ${{ vars.PROD_MAPBOX_PUBLIC_KEY }}
      NEXT_TELEMETRY_DISABLED: '1'
      AQSI_WORKER_ENABLED: 'false'
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci --no-fund --no-audit
      - name: Install isolated PostgreSQL for employee tests
        run: npm install --prefix "$RUNNER_TEMP/belok-test-db" --no-save --no-package-lock --no-fund --no-audit @electric-sql/pglite@0.5.8
      - run: npm run test:aqsi && npm run test:manager && npm run test:employees && npm run test:roles && npm run test:inventory
        env:
          INVENTORY_TEST_PGLITE_MODULE: ${{ runner.temp }}/belok-test-db/node_modules/@electric-sql/pglite/dist/index.js
      - run: python3 scripts/deploy/test-production-deploy.py
      - run: npm run test:aqsi:integration
        env:
          AQSI_TEST_DATABASE_URL: postgresql://aqsi_test:aqsi_test@127.0.0.1:5432/aqsi_test
      - run: npm run test:kiosk-control
      - run: npx eslint scripts/package-production-release.mjs
      - run: npm run build
      - run: node scripts/package-production-release.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: belok-prod-${{ github.sha }}
          path: output/belok-prod.tar.gz
          retention-days: 7
          if-no-files-found: error
      - name: One-time production setup status
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && vars.PROD_DEPLOY_ENABLED != 'true'
        run: echo 'Build is ready. Enable production delivery with scripts/deploy/setup-prod.py and PROD_DEPLOY_ENABLED=true; see docs/github-actions-production.md.'
      - name: Deploy ready release to production
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && vars.PROD_DEPLOY_ENABLED == 'true'
        env:
          DEPLOY_KEY: ${{ secrets.PROD_DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ vars.PROD_DEPLOY_HOST }}
          DEPLOY_HOST_KEY: ${{ vars.PROD_DEPLOY_HOST_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_HOST_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/belok-prod
          chmod 600 ~/.ssh/belok-prod
          trap 'rm -f ~/.ssh/belok-prod' EXIT
          printf '%s\n' "$DEPLOY_HOST_KEY" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/belok-prod -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "root@$DEPLOY_HOST" "deploy $GITHUB_SHA" < output/belok-prod.tar.gz
